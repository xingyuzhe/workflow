name: workflow-spec
version: 1
description: >-
  Contract-first OpenSpec lifecycle: proposal -> capability spec/design pairs
  -> change design -> tasks. The schema owns artifact dependencies, ownership,
  and parser-sensitive formatting; Doctor enforces filesystem invariants.

artifacts:
  - id: proposal
    generates: proposal.md
    description: Motivation, scope, capability inventory, impact, and non-goals
    template: proposal.md
    instruction: |
      Output proposal.md with these ownership boundaries:
      - Why: motivation.
      - What Changes: scoped change list; mark breaking changes with **BREAKING**.
      - Capabilities: exact kebab-case New and Modified capability names.
      - Impact and Non-goals.

      Do not duplicate requirements, module internals, or cross-cutting decisions.
      Every listed capability requires specs/<capability>/{spec.md,design.md}.
    requires: []

  - id: specs
    generates: specs/**/*.md
    description: Verifiable behavior and module design pair for each capability
    template: spec.md
    instruction: |
      For every proposal capability, output both:
      - specs/<capability>/spec.md: delta requirements and scenarios.
      - specs/<capability>/design.md: module responsibility, structure, interfaces,
        state owned inside the module, and relationships to adjacent modules.

      spec.md parser contract:
      - Delta sections use exactly ## ADDED Requirements, ## MODIFIED Requirements,
        ## REMOVED Requirements, or ## RENAMED Requirements.
      - Requirements use exactly ### Requirement: <name> and normative SHALL/MUST.
      - Every requirement has at least one scenario using exactly
        #### Scenario: <name>, followed by **WHEN** and **THEN** bullets.
      - MODIFIED contains the complete resulting requirement block.
      - REMOVED contains **Reason** and **Migration**.
      - RENAMED uses FROM: and TO:.

      Do not duplicate proposal motivation or change-level decisions.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Required cross-cutting implementation decisions
    template: design.md
    instruction: |
      Output design.md with Context, Goals / Non-Goals, Decisions, and
      Risks / Trade-offs. It owns cross-cutting choices and their rationale.
      Reference capability designs for module internals and proposal for scope.
      If no cross-cutting decision is needed, state that explicitly and keep the
      artifact concise. This artifact is required because tasks depend on it.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Ordered, verifiable implementation checklist
    template: tasks.md
    instruction: |
      Output tasks.md grouped under numbered ## headings.
      Every task must use exactly: - [ ] X.Y <description>
      Order tasks by dependency and make completion independently verifiable.
      Reference specs for behavior and design artifacts for implementation constraints.
    requires:
      - specs
      - design

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Use the context files as the delivery contract. Produce the implementation,
    evidence, and accurate task status. Stop on artifact conflicts, missing
    material decisions, or unavailable authority.
